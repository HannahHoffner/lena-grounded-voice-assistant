[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lena-code3"
version = "0.1.0"
description = "Minimal, Markdown-grounded LENA application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "edge-tts>=7,<8",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.setuptools.data-files]
"data/canonical" = ["data/canonical/offers.json"]
"data/i18n" = [
  "data/i18n/manual_overrides.json",
  "data/i18n/offer_translations.json",
]
"data/wfs" = [
  "data/wfs/current.geojson",
  "data/wfs/last_change_report.json",
]
"data/wfs/snapshots" = ["data/wfs/snapshots/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
