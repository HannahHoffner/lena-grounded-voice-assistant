[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lena-code3"
version = "0.2.0"
description = "Curated-data, multilingual local-referral LENA prototype"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "app/static/vendor/leaflet/LICENSE"]
authors = [{name = "Hannah Hoffner"}]
requires-python = ">=3.11"
dependencies = [
  "av>=14,<18",
  "fastapi>=0.115,<1",
  "edge-tts>=7,<8",
  "httpx>=0.28,<1",
  "pydantic>=2.9,<3",
  "tzdata>=2025.2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "static/**/*",
  "static/vendor/leaflet/LICENSE",
  "resources/bootstrap/**/*.json",
  "resources/bootstrap/**/*.geojson",
  "resources/bootstrap/**/*.csv",
  "resources/bootstrap/**/*.kml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
